[env:esp32-s3-super-mini]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Use custom Arduino core with Bluepad32 support
platform_packages = 
    framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip

; Serial Monitor & USB Settings
; S3 Super Mini uses internal USB CDC
monitor_speed = 115200

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ELEGANTOTA_USE_ASYNC_WEBSERVER=1
    ;-D BOARD_HAS_PSRAM      ; Only keep this if your board actually has PSRAM
    -D ARDUINO_RUNNING_CORE=1
    -D ARDUINO_EVENT_RUNNING_CORE=1

; Flash and Memory settings
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = opi ; Only if your variant has PSRAM
board_upload.flash_size = 4MB

; Use a larger partition table because Bluepad32 + WebServer is a large build
board_build.partitions = huge_app.csv

lib_deps =
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
    ayushsharma82/ElegantOTA @ ^3.1.0